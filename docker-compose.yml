x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile

  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY}"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"

    NEO4J_URI: "bolt://scm_neo4j:7687"
    NEO4J_USER: "${NEO4J_USER}"
    NEO4J_PASSWORD: "${NEO4J_PASSWORD}"
    NEO4J_DATABASE: "${NEO4J_DATABASE}"

    WEATHERAPI_KEY: "${WEATHERAPI_KEY}"
    GDELT_TIMESPAN: "LAST24H"
    PORTWATCH_MOCK: "${PORTWATCH_MOCK:-true}"
    MARINETRAFFIC_API_KEY: "${MARINETRAFFIC_API_KEY:-}"

    PYTHONPATH: "/opt/airflow/supply-chain-monitor"

  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - .:/opt/airflow/supply-chain-monitor

  depends_on:
    airflow_postgres:
      condition: service_healthy
    scm_neo4j:
      condition: service_healthy

  networks:
    - scm_network

services:

  scm_neo4j:
    image: neo4j:5.18-community
    container_name: scm_neo4j

    ports:
      - "7474:7474"
      - "7687:7687"

    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"

      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache_size: "1G"

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins

    healthcheck:
      test: ["CMD-SHELL","wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

    networks:
      - scm_network

  airflow_postgres:
    image: postgres:15
    container_name: scm_airflow_postgres

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s

    networks:
      - scm_network

  airflow_init:
    <<: *airflow-common
    container_name: scm_airflow_init

    entrypoint: /bin/bash

    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@supplychain.local || true

  airflow_webserver:
    <<: *airflow-common
    container_name: scm_airflow_webserver

    command: webserver

    ports:
      - "8080:8080"

    depends_on:
      airflow_init:
        condition: service_completed_successfully

  airflow_scheduler:
    <<: *airflow-common
    container_name: scm_airflow_scheduler

    command: scheduler

    depends_on:
      airflow_init:
        condition: service_completed_successfully

networks:
  scm_network:
    driver: bridge

volumes:
  airflow_postgres_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins: