# docker-compose.yml

services:

  neo4j:
    image: neo4j:5.18-community
    container_name: sc_neo4j    
    environment:
      NEO4J_AUTH: neo4j/supply_chain_secret
      NEO4J_PLUGINS: '["apoc"]'          # ← remove gds from auto-install
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*,gds.*
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./neo4j_plugins:/plugins


  redis:
    image: redis:7-alpine
    container_name: sc_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow:
      build:
        context: .
        dockerfile: Dockerfile.airflow
      container_name: sc_airflow
      depends_on:
        neo4j:
          condition: service_healthy
        redis:
          condition: service_healthy
      env_file:
        - .env
      environment:
        AIRFLOW__CORE__EXECUTOR: SequentialExecutor
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
        AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        AIRFLOW__WEBSERVER__SECRET_KEY: supplychain_airflow_secret
        _PIP_ADDITIONAL_REQUIREMENTS: "neo4j==5.* feedparser==6.* redis==5.* requests==2.* pydantic==2.* python-dateutil==2.*"
        NEO4J_URI: bolt://neo4j:7687
        NEO4J_USER: neo4j
        NEO4J_PASSWORD: supply_chain_secret
        REDIS_URL: redis://redis:6379
        WEATHERAPI_KEY: ${WEATHERAPI_KEY}
        PYTHONPATH: /opt/airflow
      volumes:
        - ./phase2/dags:/opt/airflow/dags
        - ./phase2:/opt/airflow/phase2
        - airflow_data:/opt/airflow
      ports:
        - "8080:8080"
      entrypoint: /bin/bash
      command:
        - -c
        - |
          airflow db migrate &&
          airflow users create \
            --username admin \
            --password admin_secret \
            --firstname Admin \
            --lastname User \
            --role Admin \
            --email admin@supplychain.local || true &&
          airflow webserver &
          airflow scheduler
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
        interval: 30s
        timeout: 10s
        retries: 5
        start_period: 60s

  webhook_receiver:
    build:
      context: .
      dockerfile: phase2/webhooks/Dockerfile
    container_name: sc_webhooks
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: supply_chain_secret
      REDIS_URL: redis://redis:6379
      PYTHONPATH: /app
    ports:
      - "8001:8001"
    volumes:
    - webhook_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 120s
      timeout: 10s
      retries: 3

# ─────────────────────────────────────────────
# Named volumes — must be declared here or
# docker compose down throws "undefined volume"
# ─────────────────────────────────────────────
volumes:
  neo4j_data:
  neo4j_logs:
  redis_data:
  airflow_data:
  neo4j_plugins:
  webhook_data:  