# Add these blocks into your existing docker-compose.yml.
# Do not replace the whole file — merge these service/volume entries in.

services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: sc_chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  phase5_agent_consumer:
    build:
      context: ./phase2/phase5   # nested under phase2 to inherit its volume mounts
      dockerfile: Dockerfile
    container_name: sc_phase5_consumer
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      GROQ_API_KEY: ${GROQ_API_KEY}
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: "8000"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      neo4j:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  chromadb_data:

